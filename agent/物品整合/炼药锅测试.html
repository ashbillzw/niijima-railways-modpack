function rich(el,text){el.replaceChildren();text.split(/(`[^`]+`)/g).forEach(part=>{if(part.startsWith('`')&&part.endsWith('`')){const code=document.createElement('code');code.textContent=part.slice(1,-1);el.append(code);}else el.append(document.createTextNode(part));});}
async function copyCommand(command){
 try{await navigator.clipboard.writeText(command);say('已复制：'+command);}
 catch{
  const area=document.createElement('textarea');area.value=command;area.style.position='fixed';area.style.top='0';document.body.append(area);area.select();
  let copied=false;try{copied=document.execCommand('copy');}catch{}area.remove();
  if(copied)say('已复制：'+command);else window.prompt('请手动复制命令：',command);
 }
}
function render(){
 const i=index(),c=cases[i],a=state.answers[c.id];
 $('category').textContent=c.category;$('position').textContent=`第 ${i+1} / ${cases.length} 题`;$('caseId').textContent=c.id;
 $('result').textContent=a?.status==='pass'?'已通过':a?.status==='fail'?'未通过':'未测';
 rich($('action'),c.action);rich($('expected'),c.expected);rich($('notes'),c.notes);
 $('supplies').replaceChildren();
 for(const item of c.supplies??[]){const button=document.createElement('button');button.textContent=`复制 ${item.name} ×${item.count}`;button.title=item.command;button.onclick=()=>copyCommand(item.command);$('supplies').append(button);}
 for(const item of c.commands??[]){const button=document.createElement('button');button.textContent=`复制 ${item.name}`;button.title=item.command;button.onclick=()=>copyCommand(item.command);$('supplies').append(button);}
 if(!c.supplies?.length&&!c.commands?.length)$('supplies').textContent='—';
 $('reference').textContent=`来源：${c.source}；实现记录：${c.progress}；原测试记录：${c.previous}`;
 $('comments').value=a?.comment??'';$('prev').disabled=i===0;$('next').disabled=i===cases.length-1;
 const all=cases.map(c=>state.answers[c.id]).filter(Boolean),p=all.filter(a=>a.status==='pass').length,f=all.filter(a=>a.status==='fail').length;
 $('counts').textContent=`已测 ${p+f} / ${cases.length} · 成功 ${p} · 失败 ${f} · 未测 ${cases.length-p-f}`;$('progress').max=cases.length;$('progress').value=p+f;
}
function go(i){flush();state.current=cases[i].id;persist();render();}
function mark(status){flush();state.answers[state.current].status=status;const id=state.current,i=index();if(i<cases.length-1)state.current=cases[i+1].id;persist();render();say(`${id} 已保存为${status==='pass'?'成功':'失败'}。${i===cases.length-1?'已到最后一题，可保存进度。':''}`);}
try{const saved=localStorage.getItem(key);if(saved){state=validate(JSON.parse(saved));say('已恢复本浏览器上次的进度。');}}catch{say('未恢复本地暂存；可用“加载进度”导入备份。');}
render();
let importBusy=false;
$('comments').addEventListener('input',flush);
$('pass').onclick=()=>mark('pass');$('fail').onclick=()=>mark('fail');
$('prev').onclick=()=>go(Math.max(0,index()-1));$('next').onclick=()=>go(Math.min(cases.length-1,index()+1));
$('jumpForm').onsubmit=e=>{e.preventDefault();const text=$('jump').value.trim().toUpperCase(),i=/^\d+$/.test(text)?Number(text)-1:cases.findIndex(c=>c.id===text);if(i<0||i>=cases.length){say(`请输入 1–${cases.length} 的序号或现有编号（如 A05.1）。`);return;}go(i);say(`已跳转到 ${state.current}。`);};
$('save').onclick=()=>{flush();const data={...state,exportedAt:new Date().toISOString(),versions:{helper:'0.1.30',trainresync:'1.6.0.m'}};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`炼药锅测试进度-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);say('已导出当前进度，请保留下载的 JSON 文件。');};
$('load').onclick=()=>{if(!importBusy)$('file').click();};
$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;importBusy=true;try{const loaded=validate(JSON.parse(await file.text()));state=loaded;persist();render();say('已加载进度，当前记录已替换。');}catch(e){say(`加载失败，原进度保留：${e.message}`);}finally{importBusy=false;$('file').value='';}};
</script></html>
