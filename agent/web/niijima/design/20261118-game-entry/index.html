<output aria-live="polite">模拟数据</output></nav><main id="screen"></main><script>const NodeRound2 = (() => {
  const white = '#fff6dc', ink = '#102f27';
  const colors = ['#ffac23','#ddf385'];
  const font = 'Noto Sans SC, Niijima Meow';
  const titles = ['倾斜巨字','留白色块','描边叠字','纵排标题','弧面色场','玻璃分区'];
  const lettering = ['斜体粗黑','直立厚黑','窄长高字','宽距平排','实心描边','双色错印'];
  const buttons = ['斜向整块','拼接票面','双层细框','长线箭头','双弧拼合','侧翼实心'];
  const nodes = [['mc1','mc5'],['mc2','mc6']];
  const person = '<g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><path d="M2 20v-2a7 7 0 0 1 14 0v2M15 5a3 3 0 0 1 0 6m3 3a6 6 0 0 1 4 6"/></g>';
  function escape(value) {
    return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
  }
  function roster(total,names) {
    if (total == null) return '—';
    const visible = names.slice(0,Math.min(3,total));
    return visible.length ? visible.join(', ') + (total>visible.length?' +'+(total-visible.length):'') : String(total);
  }
  function type(text,x,y,size,extra='') {
    return '<text x="'+x+'" y="'+y+'" font-size="'+size+'" '+extra+'>'+text+'</text>';
  }
  function heading(kind,side) {
    const name = side?'测试服':'主服', accent=colors[side];
    const size=side?72:84;
    if(kind===0) return '<g transform="translate(17 0) skewX(-9)">'+type(name,0,88,size,'font-weight="900" letter-spacing="-4"')+'</g><path d="M0 106h350" stroke="'+white+'" stroke-opacity=".45"/><path d="M0 106h55" stroke="'+accent+'" stroke-width="4"/>';
    if(kind===1) return '<path d="M0 9h316l34 32v61H0z" fill="'+(side?accent:white)+'"/>'+type(name,18,83,side?65:72,'fill="'+ink+'" font-weight="800" letter-spacing="1"')+'<path d="M320 16v22h22" fill="none" stroke="'+ink+'" stroke-width="1.3"/>';
    if(kind===2) return '<g font-weight="900" letter-spacing="-3">'+type(name,15,72,side?83:98,'fill="none" stroke="'+accent+'" stroke-width="1" opacity=".65"')+type(name,0,104,side?74:90)+'</g>';
    if(kind===3){
      const chars=[...name], fs=side?32:43;
      return '<path d="M0 8h53l-53 28z" fill="'+accent+'"/>'+chars.map((c,i)=>type(c,11,42+i*fs,fs,'font-family="SimSun, serif"')).join('')+'<path d="M74 15v92M90 107h260" stroke="'+white+'" stroke-opacity=".4"/><path d="M90 107h45" stroke="'+accent+'" stroke-width="3"/>';
    }
    if(kind===4) return '<g transform="translate(18 0) skewX(-10)">'+type(name,0,92,side?77:91,'fill="'+ink+'" stroke="'+ink+'" stroke-width="1.1" paint-order="stroke fill" font-weight="900" letter-spacing="-3"')+'</g>';
    return '<path d="M2 19v-9h346v9M2 96v10h346v-10" fill="none" stroke="'+white+'" stroke-opacity=".45"/>'+type(name,175,84,58,'font-weight="500" letter-spacing="12" text-anchor="middle"')+'<path d="M151 106h48" stroke="'+accent+'" stroke-width="3"/>';
  }
  function action(kind,side,node,solid=false) {
    const accent=colors[side],label=node?'进入 '+node:'自动选择节点';
    const directional='<path d="M0 0h24m-7-7 7 7-7 7"/>';
    let face='',textX=22,textColor=ink,iconX=296,iconColor=ink;
    if(kind===0){
      if(solid&&side) textColor=iconColor=white;
      face='<path d="M24 0H350L326 70H0z" fill="'+(solid?(side?ink:white):accent)+'"/><path d="M31 8h298" stroke="'+textColor+'" stroke-width="1" stroke-opacity=".4"/>';
      textX=30;iconX=290;
    } else if(kind===1){
      face='<path d="M0 0h269v70H0z" fill="'+white+'"/><path d="M270 0h80v70h-80z" fill="'+(solid?ink:accent)+'"/><path d="M269 6v58" stroke="'+ink+'" stroke-width="1" stroke-dasharray="3 4"/>';
      if(solid) iconColor=white;
    } else if(kind===2){
      const line=solid?ink:accent;
      face='<rect x="1" y="1" width="348" height="68" fill="'+(solid?accent:'#09241edb')+'" stroke="'+line+'" stroke-width="2"/><path d="M9 9H341V61H9z" fill="none" stroke="'+line+'" stroke-opacity=".3"/><path d="M287 10v50" stroke="'+line+'" stroke-opacity=".3"/>';
      textColor=iconColor=line;iconX=307;
    } else if(kind===3){
      const line=solid?ink:accent;
      face='<path d="M0 0h350v70H0z" fill="'+(solid?white:ink)+'"/><path d="M0 69h350" stroke="'+line+'" stroke-width="2"/><path d="M295 13h55v57h-67z" fill="'+line+'"/><path d="M190 51h90" stroke="'+line+'" stroke-width="2"/>';
      textColor=line;textX=16;iconX=310;iconColor=solid?white:ink;
    } else if(kind===4){
      const end=solid&&!side?white:ink;
      face='<rect x="1" y="1" width="348" height="68" rx="34" fill="'+accent+'"/><path d="M270 1h44a34 34 0 0 1 0 68h-67z" fill="'+end+'"/><path d="M270 1 247 69" stroke="'+ink+'" stroke-width="2"/><rect x="1" y="1" width="348" height="68" rx="34" fill="none" stroke="'+(solid?ink:accent)+'" stroke-width="2"/>';
      textX=28;iconColor=end===white?ink:white;
    } else {
      face='<path d="M0 1h350v68H0z" fill="'+(solid?white:accent)+'"/><path d="M0 1h65v68H0z" fill="'+ink+'"/><path d="M65 1v68" stroke="'+white+'" stroke-opacity=".5"/>';
      textX=85;iconX=21;iconColor=accent;
    }
    return face+type(label,textX,46,30,'fill="'+textColor+'" font-weight="750"')+'<g transform="translate('+iconX+' 35)" fill="none" stroke="'+iconColor+'" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">'+directional+'</g>';
  }
  function letterHeading(kind,side) {
    const name=side?'测试服':'主服';
    const bold='fill="'+ink+'" font-weight="900" stroke="'+ink+'" stroke-width="1.1" paint-order="stroke fill"';
    if(kind===0) return '<g transform="translate(18 0) skewX(-10)">'+type(name,0,92,side?77:91,bold+' letter-spacing="-3"')+'</g>';
    if(kind===1) return type(name,0,91,side?80:92,bold+' letter-spacing="-2"');
    if(kind===2) return '<g transform="translate(13 0) skewX(-6) scale(.75 1.12)">'+type(name,0,84,side?91:98,bold+' letter-spacing="-3"')+'</g>';
    if(kind===3) return type(name,0,85,side?64:72,'fill="'+ink+'" font-weight="700" letter-spacing="12"');
    if(kind===4) {
      const lead=side?'测试':'主',size=side?78:90;
      return '<g transform="translate(17 0) skewX(-9)" font-weight="900">'+type(lead,0,92,size,'fill="'+ink+'" letter-spacing="-3"')+type('服',lead.length*(size-3),92,size,'fill="none" stroke="'+ink+'" stroke-width="1.8"')+'</g>';
    }
    return '<g transform="translate(12 0) skewX(-9)" font-weight="900" letter-spacing="-3">'+type(name,4,96,84,'fill="'+white+'"')+type(name,0,91,84,bold)+'</g>';
  }
  function screen({title=4,button=0,headingStyle=5,selected='mc6',total=8,testTotal=1,map='../../dist/assets/game-entry-map.jpg',portrait=false}={}){
    const width=portrait?740:1000,height=portrait?860:720;
    const positions=portrait?[[40,80],[405,460]]:[[54,86],[596,353]];
    const contentScale=portrait?.88:1;
    const cardWidth=portrait?350:350;
    let s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+width+' '+height+'" font-family="'+font+'" fill="'+white+'" role="group" aria-label="主服与测试服节点设计">';
    s+='<defs><linearGradient id="tint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123f2c" stop-opacity=".95"/><stop offset=".5" stop-color="#163d32" stop-opacity=".56"/><stop offset="1" stop-color="#0b2b21" stop-opacity=".98"/></linearGradient><pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#f8f5dc"/></pattern><linearGradient id="glass" x2=".4" y2="1"><stop stop-color="#b8d6bb" stop-opacity=".12"/><stop offset="1" stop-color="#031e15" stop-opacity=".7"/></linearGradient></defs>';
    s+='<rect width="'+width+'" height="'+height+'" rx="12" fill="#3a4537"/><rect x="8" y="8" width="'+(width-16)+'" height="'+(height-16)+'" rx="6" fill="#18251d"/><image x="15" y="15" width="'+(width-30)+'" height="'+(height-30)+'" preserveAspectRatio="xMidYMid slice" href="'+escape(map)+'"/><rect x="15" y="15" width="'+(width-30)+'" height="'+(height-30)+'" fill="url(#tint)"/>';
    if(title===0) s+='<path d="M390 190 600 190M390 190v176M540 450v147" stroke="'+white+'" stroke-opacity=".23" fill="none"/>';
    if(title===2) s+='<path d="M140 16h84L16 224V139zM'+(width-140)+' '+(height-15)+'h-84l209-209v84z" fill="'+colors[0]+'" opacity=".18"/>';
    if(title===3) s+='<path d="M'+(width/2)+' 170v360" stroke="'+white+'" stroke-opacity=".15"/>';
    if(title===4) {
      // Trace the approved 746 x 718 reference independently of card placement.
      s+='<g transform="translate(15 15) scale('+((width-30)/746)+' '+((height-30)/718)+')">';
      s+='<path d="M0 0H244C222 23 224 48 251 54C302 65 366 25 410 0H542C475 57 440 89 411 149C386 189 394 219 367 257C349 295 326 328 280 351C236 372 194 379 151 378C85 377 38 400 0 444Z" fill="'+colors[0]+'"/>';
      s+='<path d="M0 600C73 554 172 578 270 650L220 718H0Z" fill="#05281e"/>';
      s+='<path d="M746 290C704 326 660 332 595 335C460 335 416 365 378 448C347 512 355 555 317 602C286 642 226 681 170 718H216C273 691 318 695 361 718H746Z" fill="'+colors[1]+'"/></g>';
    }
    s+='<g transform="translate('+(width-133)+' 36)" role="button" tabindex="0" aria-label="单人游戏"><rect width="96" height="30" rx="15" fill="#163a31b0" stroke="#c6d4bb" stroke-opacity=".55"/>'+type('单人游戏',48,20,14,'text-anchor="middle"')+'</g>';
    for(const side of [0,1]){
      const [x,y]=positions[side],color=title===4?ink:colors[side],chosen=nodes[side].includes(selected)?selected:null;
      s+='<g transform="translate('+x+' '+y+') scale('+contentScale+')" data-server="'+side+'" fill="'+(title===4?ink:white)+'">';
      if(title===5) s+='<path d="M-18-8H362L370 313H-30z" fill="url(#glass)" stroke="'+white+'" stroke-opacity=".2"/>';
      s+=headingStyle===null?heading(title,side):letterHeading(headingStyle,side);
      const playerText=roster(side?testTotal:total,['NameA','NameB','NameC']);
      const rosterY=title===3?58:130,rosterX=title===3?90:0;
      s+='<svg x="'+rosterX+'" y="'+(rosterY-17)+'" width="18" height="18" viewBox="0 0 24 24" color="'+(title===4?ink:white)+'">'+person+'</svg>'+type(escape(playerText),rosterX+30,rosterY,14);
      const routeY=155;
      s+='<rect x="0" y="'+routeY+'" width="'+cardWidth+'" height="76" fill="#08251d" opacity="'+(title===4?'0':title===5?'.15':'.62')+'"/>';
      nodes[side].forEach((node,i)=>{
        const rowY=routeY+i*38;
        s+='<g data-node="'+node+'" data-side="'+side+'" role="radio" tabindex="0" aria-label="'+node+'" aria-checked="'+(selected===node)+'" style="cursor:pointer"><rect x="0" y="'+rowY+'" width="350" height="38" fill="'+(selected===node?'#e3f2bb18':'transparent')+'"/><path d="M0 '+rowY+'h350" stroke="'+(title===4?ink:white)+'" stroke-opacity=".45"/><circle cx="9" cy="'+(rowY+19)+'" r="4.2" stroke="'+color+'" fill="'+(selected===node?color:'none')+'"/>'+type(node,30,rowY+26,20,'font-weight="650"')+type(i?'联通节点':'电信节点',86,rowY+25,14)+type([[32,49],[40,59]][side][i]+' ms',350,rowY+26,20,'text-anchor="end"')+'</g>';
      });
      s+='<g transform="translate(0 248)" data-entry="'+side+'" role="button" tabindex="0" aria-label="'+(chosen?'进入 '+chosen:'自动选择节点')+'" style="cursor:pointer">'+action(button,side,chosen,title===4)+'</g></g>';
    }
    return s+'</svg>';
  }
  return {titles,lettering,buttons,screen,roster,action,heading};
})();
if(typeof module!=='undefined')module.exports=NodeRound2;
</script><script>
const $=id=>document.getElementById(id);
let selected=null, activeTab='game';
function draw(){
  const headingStyle=Number($('title').value);
  $('screen').innerHTML=activeTab==='map'?'<img src="../../dist/assets/game-entry-map.jpg" alt="主服地图" style="display:block;width:100%;max-height:78vh;object-fit:cover">':NodeRound2.screen({headingStyle,selected,total:Number($('total').value),testTotal:Number($('testTotal').value),portrait:$('aspect').value==='portrait'});
  document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',String(headingStyle===Number(b.dataset.preset))));
  document.querySelector('output').textContent='模拟数据';
  document.querySelectorAll('[data-node]').forEach(el=>{
    const activate=()=>{selected=el.dataset.node;draw();document.querySelector('[data-node="'+selected+'"]')?.focus()};
    el.onclick=activate;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}};
  });
  document.querySelectorAll('[data-entry]').forEach(el=>{
    const activate=()=>{const side=Number(el.dataset.entry), available=side?['mc2','mc6']:['mc1','mc5'];document.querySelector('output').textContent='模拟进入 '+(available.includes(selected)?selected:available[0])};
    el.onclick=activate;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}};
  });
}
document.querySelectorAll('select').forEach(el=>el.onchange=draw);
document.querySelectorAll('[data-preset]').forEach(el=>el.onclick=()=>{$('title').value=el.dataset.preset;draw()});
document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{
  const next=el.dataset.tab;
  if(next!==activeTab){selected=null;activeTab=next}
  document.querySelectorAll('[data-tab]').forEach(tab=>tab.setAttribute('aria-pressed',String(tab.dataset.tab===activeTab)));
  draw();
});
draw();
</script></body></html>
