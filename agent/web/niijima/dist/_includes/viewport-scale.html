<script>
(() => {
  const root = document.documentElement;
  if (window !== window.top && root.classList.contains('embedded')) return;
  function sizePage() {
    root.style.setProperty('--page-scale', Math.min(innerHeight / 1080, innerWidth / 420));
  }
  sizePage();
  window.addEventListener('resize', sizePage);
})();
</script>
