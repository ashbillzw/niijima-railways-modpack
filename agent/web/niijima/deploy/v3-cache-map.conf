# http context. Use expires $niijima_v3_expires in /v3/, /synology-root and /index-preview.html.
# Negative expiry emits Cache-Control: no-cache and preserves HTTP validators.
map $uri $niijima_v3_expires {
    default off;
    /index-preview.html -1s;
    /v3/assets/rail-network-v15.svg -1s;
    ~^/synology-root/minecraft/niijima-website-v3/assets/rail-network/(2026-03-01|2025-09-14|2024-end)\.svg$ -1s;
    ~*^/v3/.*\.(css|js|html)$ -1s;
}
