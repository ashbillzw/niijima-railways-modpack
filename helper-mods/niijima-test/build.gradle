plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft.mappings channel: 'official', version: '1.20.1'

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    compileOnly files(new File(providers.environmentVariable('NIIJIMA_MODS_DIR').get(), 'fancymenu_forge_3.7.0_MC_1.20.1.jar'))
}

jar.archiveFileName = 'niijima-client-test.jar'

tasks.register('stageTestMod', Copy) {
    dependsOn 'reobfJar'
    from tasks.jar.archiveFile
    into 'dist'
}
build.dependsOn stageTestMod
